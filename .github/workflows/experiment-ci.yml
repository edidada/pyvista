name: Experiment CI - pytest core

on:
  push:
    branches:
      - edidada/main
  workflow_dispatch:

env:
  ALLOW_PLOTTING: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same headless-display setup as the upstream unit-tests workflow.
      - uses: pyvista/setup-headless-display-action@v4
      - name: Install OpenGL libraries
        run: sudo apt-get update && sudo apt-get install -y libosmesa6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package with test dependency group
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group test
      # Core (non-plotting) subset of the upstream unit-test suite.
      - name: Run core tests
        run: pytest tests/core -q -n auto
